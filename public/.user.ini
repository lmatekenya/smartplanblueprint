; PHP settings for InfinityFree hosting
max_execution_time = 30
max_input_time = 60
memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 2M
display_errors = Off
log_errors = On

; Security settings
session.cookie_httponly = 1
session.use_only_cookies = 1

; Optimization
zend.enable_gc = On
output_buffering = 4096

; Allow Symfony to handle errors
auto_prepend_file = none
auto_append_file = none
