name: 🚀 Deploy to smartplanblueprint.fwh.is

on:
    push:
        branches: [ main, smartplan ]
    workflow_dispatch:

jobs:
    deploy:
        name: 🎉 Deploy to InfinityFree
        runs-on: ubuntu-latest
        steps:
            - name: 🚚 Get latest code
              uses: actions/checkout@v4

            - name: 🐘 Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.0'
                  extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath
                  coverage: none

            - name: 📦 Install Dependencies
              run: |
                  # Downgrade Symfony packages to a version compatible with PHP 8.0
                  composer require symfony/flex:^2.0 --no-update
                  composer require symfony/framework-bundle:^6.0 --no-update
                  composer require symfony/runtime:^6.0 --no-update
                  composer require symfony/dotenv:^6.0 --no-update
                  # Update other Symfony packages to v6
                  grep -o '"symfony/[^"]*":.*7\.3\.\*' composer.json | sed 's/:.*/:^6.0/' | xargs -I{} composer require {} --no-update
                  # Install all dependencies
                  composer install --no-dev --optimize-autoloader

#            - name: 🛠️ Configure Environment
#              run: |
#                  echo "APP_ENV=prod" > .env
#                  echo "APP_DEBUG=0" >> .env
#                  echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
#                  echo "APP_SECRET=${{ secrets.APP_SECRET }}" >> .env


            -   name: 🛠️ Configure Environment
                run: |
                    # Copy production environment file
                    cp .env.prod .env

                    # Append or override with secrets
                    echo "DATABASE_URL=\"${{ secrets.DATABASE_URL }}\"" >> .env
                    echo "APP_SECRET=${{ secrets.APP_SECRET }}" >> .env

                    # Ensure production settings
                    sed -i "s/APP_ENV=.*/APP_ENV=prod/" .env
                    sed -i "s/APP_DEBUG=.*/APP_DEBUG=0/" .env

                    # Optional: Dump env for better performance
                    composer dump-env prod

            - name: 🧹 Clear and Warmup Cache
              run: |
                  php bin/console cache:clear --env=prod --no-debug
                  php bin/console cache:warmup --env=prod --no-debug

                  # Only if database exists
                  php bin/console doctrine:migrations:migrate --no-interaction --env=prod --allow-no-migration

            - name: 🛠️ Fix Permissions
              run: |
                  chmod -R 755 var
                  chmod -R 755 public

            - name: 📤 Deploy via FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ftpupload.net
                  username: ${{ secrets.FTP_Username }}
                  password: ${{ secrets.FTP_Password }}
                  server-dir: smartplanblueprint.fwh.is/htdocs/
                  retries: 5
                  retryDelay: 20
                  exclude: |
                      **/.git*
                      **/.github/**
                      **/tests/**
                      **/var/cache/**
                      **/var/log/**
                      composer.*
                      symfony.lock
                      phpunit.*
                      .env.local
                      .env.test
