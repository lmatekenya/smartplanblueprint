name: 🚀 Deploy Symfony to InfinityFree

on:
    push:
        branches: [main, smartplan]
    workflow_dispatch:

jobs:
    deploy:
        name: 🎉 Deploy to smartplanblueprint.fwh.is
        runs-on: ubuntu-latest

        steps:
            - name: 🚚 Checkout code
              uses: actions/checkout@v4

            - name: 🐘 Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  tools: composer:v2
                  extensions: mbstring, pdo_mysql, tokenizer, xml, ctype, iconv
                  coverage: none

            - name: 📦 Install dependencies
              run: |
                  # Temporarily install dev dependencies for cache clearing
                  composer install --optimize-autoloader --no-interaction

                  # Set up production environment
                  echo "APP_ENV=prod" > .env
                  echo "APP_DEBUG=0" >> .env
                  echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
                  echo "APP_SECRET=${{ secrets.APP_SECRET }}" >> .env

                  # Clear and warmup cache
                  php bin/console cache:clear --no-debug
                  php bin/console cache:warmup --no-debug

                  # Install production dependencies ignoring Cassandra requirement
                  composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=ext-cassandra
                  composer dump-autoload --optimize --no-dev --classmap-authoritative

            - name: 🛠️ Fix directory permissions
              run: |
                  mkdir -p var/cache/prod var/log
                  chmod -R 755 var public

            - name: 📂 Sync files via FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ftpupload.net
                  username: ${{ secrets.FTP_Username }}
                  password: ${{ secrets.FTP_Password }}
                  server-dir: smartplanblueprint.fwh.is/htdocs/
                  local-dir: ./
                  exclude: |
                      .git/
                      .github/
                      .env.local
                      docker-compose*
                      phpunit*
                      tests/
                      var/cache/*
                      var/log/*
                  retries: 3
                  retry-delay: 10000
