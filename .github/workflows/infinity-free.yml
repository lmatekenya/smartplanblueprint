name: 🚀 Deploy to smartplanblueprint.fwh.is

on:
    push:
        branches: [ main, smartplan ]
    workflow_dispatch:

jobs:
    deploy:
        name: 🎉 Deploy Symfony to InfinityFree
        runs-on: ubuntu-latest

        steps:
            - name: 🚚 Checkout code
              uses: actions/checkout@v4

            - name: 🐘 Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath
                  coverage: none

            - name: 📦 Install dependencies
              run: |
                  composer install --no-dev --optimize-autoloader --ignore-platform-reqs
                  composer dump-autoload --optimize

            - name: 🔧 Configure environment
              run: |
                  echo "APP_ENV=prod" > .env
                  echo "APP_DEBUG=0" >> .env
                  echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
#                  echo "APP_SECRET=${{ secrets.APP_SECRET }}" >> .env

            - name: 🧹 Clear and warmup cache
              run: |
                  rm -rf var/cache/*
                  php bin/console cache:clear --env=prod --no-debug
                  php bin/console cache:warmup --env=prod --no-debug

            - name: 🗑️ Remove development files
              run: |
                  rm -rf tests/
                  rm -rf .github/
                  rm -f .env.local .env.test .gitattributes .gitignore

            - name: 📤 Deploy via FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ftpupload.net
                  username: ${{ secrets.FTP_Username }}
                  password: ${{ secrets.FTP_Password }}
                  server-dir: smartplanblueprint.fwh.is/htdocs/
                  local-dir: ./
                  exclude: |
                      **/.git*
                      **/.github/**
                      **/tests/**
                      **/node_modules/**
                      **/var/cache/**
                      **/var/log/**
                      **/.env
                      composer.*
                      symfony.lock
